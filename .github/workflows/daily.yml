name: 대시보드 매일 갱신

on:
  schedule:
    # GitHub Actions의 cron은 UTC 기준이다. 22:00 UTC = 다음날 07:00 KST.
    # 미국 시장이 한국시간 오전 5~6시에 마감하므로 전일 미국 종가가 확정된 시점이다.
    - cron: "0 22 * * *"
  workflow_dispatch: # 버튼으로 즉시 실행 (설치 직후 확인용)
  push:
    branches: [main] # 코드를 고치면 바로 다시 배포된다

# Pages 배포 + 실행 기록 커밋에 필요한 권한
# contents는 read가 아니라 write다. 아래 '실행 기록 남기기' 단계가 저장소에
# 커밋을 하나 남겨야 하기 때문이다. 이유는 그 단계의 주석 참고.
permissions:
  contents: write
  pages: write
  id-token: write

# 갱신이 겹치면 나중 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 러너는 UTC라서 지정하지 않으면 화면의 '기준 시각'이 9시간 어긋난다.
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 파이썬 표준 라이브러리만 쓰므로 의존성 설치 단계가 없다.
      - name: 대시보드 생성
        run: python3 daily_dashboard.py

      - name: 결과 점검
        # 수집이 조용히 실패해 빈 페이지가 올라가는 것을 막는다.
        # 실패하면 이 워크플로가 중단되고, 직전에 배포된 페이지가 그대로 남는다.
        run: |
          set -e
          test -f dashboard.html
          SIZE=$(wc -c < dashboard.html)
          echo "생성 크기: ${SIZE} bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::HTML이 100KB 미만입니다. 수집이 실패한 것으로 보고 배포를 중단합니다."
            exit 1
          fi
          # HTML에서 &는 &amp;로 이스케이프되므로 앰퍼샌드가 든 문자열은 쓰지 않는다.
          for KEYWORD in "PART 1" "PART 2" "코스피" "나스닥" "다우존스" "주목할 개별종목"; do
            grep -q "$KEYWORD" dashboard.html || {
              echo "::error::'$KEYWORD' 섹션이 없습니다. 배포를 중단합니다."
              exit 1
            }
          done
          echo "점검 통과"

      - name: 배포 폴더 준비
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub은 저장소에 60일간 커밋이 없으면 예약 실행(cron)을 조용히 꺼버린다.
      # 이 대시보드는 결과물을 저장소에 남기지 않고 Pages로만 내보내므로,
      # 아무 조치가 없으면 두 달 뒤 이유 없이 멈춘다.
      # 그래서 매 실행마다 기록을 한 줄 남겨 저장소를 '활동 중'으로 유지한다.
      #
      # 커밋 메시지 끝의 [skip ci]가 핵심이다. 이게 없으면 이 커밋이 다시
      # push 트리거를 당겨 워크플로가 무한히 자기를 호출한다.
      - name: 실행 기록 남기기 (예약 실행 자동 해제 방지)
        run: |
          set -e
          mkdir -p state
          date '+%Y-%m-%d %H:%M:%S %Z' > state/last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-run.txt
          # 내용이 같으면 커밋할 게 없으므로 건너뛴다 (같은 날 두 번 돌린 경우).
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "자동 갱신 $(date '+%Y-%m-%d %H:%M') [skip ci]"
            # 그사이 누군가 push했을 수 있으니 한 번 당겨 붙인 뒤 올린다.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
